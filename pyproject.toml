[project]
name = "llmbias-tse"
version = "0.1.0"
description = "Harness aberto de coleta e análise para auditoria automatizada de modelos de IA generativa no contexto eleitoral brasileiro (TSE 2026)."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "jtrecenti", email = "julio.trecenti@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "patchright>=1.60.1",
    "python-dotenv>=1.2.2",
    "google-genai>=1.0.0",
    "pydantic>=2.0",
    "openpyxl>=3.1",
    "pandas>=2.0",
    "anthropic>=1.0.0",
    "openai>=3.3.1",
    "pyarrow>=25.0.1",
]

[project.optional-dependencies]
# Painel de coleta (infra/local/dashboard). Fora das dependências principais:
# quem só roda a coleta ou a análise não precisa de servidor web.
painel = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
]

[project.scripts]
llmbias-tse = "llmbias_tse:main"

[build-system]
requires = ["uv_build>=0.8.17,<0.9.0"]
build-backend = "uv_build"
