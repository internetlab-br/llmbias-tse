  painel:
    image: llmbias-coleta:latest
    container_name: coleta-painel
    restart: unless-stopped
    entrypoint: ["/bin/bash", "-lc"]
    # Lista com um item só, não string: `command:` em string é quebrado em
    # palavras pelo Compose, e o `bash -lc` receberia só "uv" como script.
    command:
      - |
        uv sync --extra painel
        exec uv run uvicorn infra.local.dashboard.app:app --host 0.0.0.0 --port 8000
    working_dir: /app
    environment:
      RUN_DIR: /dados/${RUN_ID:-experimento_2026_09}
      SESSOES: ${SESSOES:-gemini chatgpt claude grok deepseek copilot google_aimode whatsapp_metaai}
      UV_CACHE_DIR: /tmp/uv-cache
      UV_LINK_MODE: copy
      UV_PROJECT_ENVIRONMENT: /home/coleta/venv
    volumes:
      - ../../:/app
      - ../../data:/dados

  caddy:
    image: caddy:2-alpine
    container_name: coleta-caddy
    restart: unless-stopped
    depends_on: [painel]
    ports:
      - "${PORTA:-8080}:8080"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
