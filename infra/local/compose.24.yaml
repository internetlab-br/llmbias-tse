# Coleta multiplataforma num host só.
#
# Uma estação por plataforma, um painel e um Caddy na frente. O Caddy é a
# única porta publicada: ele serve o painel e faz proxy das telas noVNC, então
# o cloudflared precisa apontar para um endereço só e ninguém abre 8 portas.
#
# Subir tudo:            docker compose up -d
# Subir uma estação:     docker compose up -d coleta-gemini
# Ver a tela de uma:     http://localhost:8080/vnc/gemini/vnc.html
#
# As estações NÃO começam a coletar sozinhas (AUTO_INICIAR=0): estação nova
# precisa de um humano logando na conta pela tela remota antes de qualquer
# coisa. Depois do login, o play é no painel.

name: llmbias-coleta

x-estacao: &estacao
  build:
    context: .
    dockerfile: Dockerfile
    args:
      # Tem de casar com o dono de `data/` no host. Ver Dockerfile.
      UID: ${UID:-1000}
      GID: ${GID:-1000}
  image: llmbias-coleta:latest
  restart: unless-stopped
  # Chrome escreve muito em /dev/shm; o padrão de 64 MB do Docker faz a aba
  # morrer no meio de uma conversa longa.
  shm_size: 2gb
  volumes:
    - ../../:/app                      # repo (código muda sem rebuild)
    - ../../data:/dados                # rodadas: o painel lê o mesmo diretório
  environment: &ambiente
    RUN_ID: ${RUN_ID:-experimento_2026_09}
    DADOS: /dados
    EIXOS: ${EIXOS:-voto genero integridade}
    LOTE: ${LOTE:-20}
    TURN_DELAY: ${TURN_DELAY:-5}
    CONV_DELAY: ${CONV_DELAY:-12}
    AUTO_INICIAR: ${AUTO_INICIAR:-0}
    # Trave o IP de saída esperado para o container abortar se alguém subir
    # isto fora da rede de casa (ou com VPN ligada). Vazio = sem trava.
    IP_ESPERADO: ${IP_ESPERADO:-}
    # Só para a variante em nuvem: SOCKS de um exit node residencial.
    PROXY_SOCKS: ${PROXY_SOCKS:-}

services:
  coleta-gemini.voto:
    <<: *estacao
    container_name: coleta-gemini.voto
    environment:
      <<: *ambiente
      PLATAFORMA: gemini
      EIXOS: voto
      SESSAO: gemini.voto
    volumes:
      - ../../:/app
      - ../../data:/dados
      - ./perfis/gemini.voto:/perfil

  coleta-gemini.genero:
    <<: *estacao
    container_name: coleta-gemini.genero
