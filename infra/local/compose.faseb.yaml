  coleta-whatsapp_metaai.c1:
    <<: *estacao
    container_name: coleta-whatsapp_metaai.c1
    environment:
      <<: *ambiente
      PLATAFORMA: whatsapp_metaai
      EIXOS: genero
      FATIA: 1/1
      SESSAO: whatsapp_metaai.c1
      N_FATIAS: 1
      # Declare aqui QUAL conta está logada nesta estação; vai gravado em cada
      # conversa. google_aimode não faz login, então fica vazio.
      LLMBIAS_CONTA: ${CONTA_whatsapp_metaai_c1:-}
    volumes:
      - ../../:/app
      - ../../data:/dados
      - ./perfis/whatsapp_metaai.c1:/perfil

  painel:
    image: llmbias-coleta:latest
    container_name: coleta-painel
    restart: unless-stopped
    entrypoint: ["/bin/bash", "-lc"]
    # Lista com um item só, não string: `command:` em string é quebrado em
    # palavras pelo Compose, e o `bash -lc` receberia só "uv" como script.
    command:
      - |
        uv sync --extra painel
        exec uv run uvicorn infra.local.dashboard.app:app --host 0.0.0.0 --port 8000
    working_dir: /app
    environment:
      RUN_DIR: /dados/${RUN_ID:-experimento_2026_09}
      SESSOES: ${SESSOES:-gemini chatgpt claude grok deepseek copilot google_aimode whatsapp_metaai}
      UV_CACHE_DIR: /tmp/uv-cache
      UV_LINK_MODE: copy
      UV_PROJECT_ENVIRONMENT: /home/coleta/venv
    volumes:
      - ../../:/app
      - ../../data:/dados

  caddy:
    image: caddy:2-alpine
    container_name: coleta-caddy
    restart: unless-stopped
    depends_on: [painel]
    ports:
      - "${PORTA:-8080}:8080"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
