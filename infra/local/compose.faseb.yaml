      # conversa. google_aimode não faz login, então fica vazio.
      LLMBIAS_CONTA: ${CONTA_chatgpt_c1:-}
    volumes:
      - ../../:/app
      - ../../data:/dados
      - ./perfis/chatgpt.c1:/perfil

  coleta-claude.c1:
    <<: *estacao
    container_name: coleta-claude.c1
    environment:
      <<: *ambiente
      PLATAFORMA: claude
      EIXOS: genero
