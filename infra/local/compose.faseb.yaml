    container_name: coleta-google_aimode.c1
    environment:
      <<: *ambiente
      PLATAFORMA: google_aimode
      EIXOS: genero
      FATIA: 1/1
      SESSAO: google_aimode.c1
      N_FATIAS: 1
      # Declare aqui QUAL conta está logada nesta estação; vai gravado em cada
